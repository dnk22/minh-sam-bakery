name: CMS Theme Management Tests

on:
  pull_request:
    paths:
      - "src/cms/features/themes/**"
      - "src/app/api/cms/themes/**"
      - "src/app/(cms)/cms/(protected)/themes/**"
      - "src/cms/config/navigation.ts"
      - "src/theme/**"
      - "tests/cms-themes.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-theme-cms:
    name: Unit tests, TypeScript and targeted ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:themes
      - run: pnpm test:theme
      - run: pnpm test:landing-theme
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint src/cms/features/themes src/app/api/cms/themes tests/cms-themes.test.ts
